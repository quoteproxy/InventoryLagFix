[General]
; 0 = do nothing (the game code runs unchanged)
bEnabled=1
; armor perk conditions (WornApparelHasKeywordCount / WornHasKeyword) re-scanning the inventory
bFixArmorPerkConditions=1
; item cards looking up the worn armor of every body slot
bFixWornSlotLookup=1
; item lists (inventory, container, barter, gift, favorites) re-walking the inventory for every row
bFixItemListLookup=1
; 1 = write cache counters to the log every few seconds
bLogStats=0
; 1 = testing only: also run the original code and log any difference (slower)
bVerify=0
